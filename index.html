<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moonlight by ellii – CS2 SDK Viewer</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  </head>
  <body>

    <div id="sidebar">
      <div class="header">
        <div class="header-row">
          <i data-lucide="moon"></i>
          <div class="title">Moon<span>Light</span></div>
          <div class="header-links">
            <a href="https://discord.gg/" title="Discord"><i data-lucide="message-circle"></i></a>
            <a href="https://github.com/moonlightrblx/sdkviewer" title="GitHub"><i data-lucide="github"></i></a>
          </div>
        </div>
        <div class="class-count-label" id="class-count">Loading...</div>
      </div>

      <div id="search">
        <div class="search-wrapper">
          <i data-lucide="search" class="icon"></i>
          <input type="text" id="search-input" placeholder="Filter classes..." autofocus />
        </div>
        <div id="search-hint">
          <code>class:CBasePlayerPawn</code> • <code>m_iHealth</code>
        </div>
      </div>

      <div class="sidebar-pills">
        <button class="pill-btn" id="btn-globals" onclick="selectClassByName('MoonLightGlobals')">
          <i data-lucide="globe"></i>
          View Globals
        </button>
        <button class="pill-btn" id="btn-schema" onclick="selectClassByName('[SchemaSystem]')">
          <i data-lucide="list-tree"></i>
          View Enums
        </button>
      </div>

      <div id="classlist" role="listbox"></div>

      <div class="download-area">
        <a href="https://github.com/moonlightrblx/sdkviewer/raw/main/dumped/generated_latest.zip" class="download-btn" download>
          <i data-lucide="package" class="icon"></i>
          <span>Download SDK Dump</span>
        </a>
        <a href="https://github.com/moonlightrblx/sdkviewer/raw/main/dumped/schema_latest.zip" class="download-btn" download>
          <i data-lucide="file-code-2" class="icon"></i>
          <span>Download Schema</span>
        </a>
        <a href="https://github.com/moonlightrblx/sdkviewer/raw/main/dumped/types_dump.zip" class="download-btn" download>
          <i data-lucide="database" class="icon"></i>
          <span>Download Type Dump</span>
        </a>
      </div>
    </div>

    <div id="main">
      <div id="topbar">
        <div class="tb-title" id="tb-class-name">Select a class</div>
        <div class="tb-sep"></div>
        <div class="tb-meta" id="tb-meta"></div>
      </div>
      <div id="content-scroll">
        <div id="content"></div>
      </div>
    </div>

    <script src="js/app.js"></script>
    <script>
      lucide.createIcons();

      document.getElementById("search-input").addEventListener("input", (e) => {
        renderClassList(e.target.value);
      });

      function selectClassByName(name) {
        const items = document.querySelectorAll(".class-item");
        for (const item of items) {
          if (item.dataset.className === name) {
            item.click();
            item.scrollIntoView({ block: "center", behavior: "smooth" });
            return;
          }
        }
        selectClass(name, null);
      }

      const updateDetailsIcons = () => {
        document.querySelectorAll("details").forEach((d) => {
          let icon = d.querySelector("summary .lucide-chevron");
          if (!icon) {
            icon = document.createElement("i");
            icon.className = "lucide-chevron";
            icon.dataset.lucide = d.open ? "chevron-down" : "chevron-right";
            d.querySelector("summary").insertBefore(icon, d.querySelector("summary").firstChild);
          } else {
            icon.dataset.lucide = d.open ? "chevron-down" : "chevron-right";
          }
        });
        lucide.createIcons();
      };
    </script>
  </body>
</html>
