<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moonlight by ellii – CS2 SDK Viewer</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" />
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-clike.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-c.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-cpp.min.js"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  </head>
  <body data-theme="pink">
    <div id="sidebar">
      <div class="header">
        <div class="header-row">
          <i data-lucide="moon"></i>
          <div class="title">Moon<span>Light</span></div>
          <div class="header-links">
            <a href="https://discord.gg/C4uhQTMx8q" title="Discord" target="_blank" rel="noopener"><i data-lucide="message-circle"></i></a>
            <a href="https://github.com/moonlightrblx/sdkviewer" title="GitHub" target="_blank" rel="noopener"><i data-lucide="github"></i></a>
          </div>
        </div>
        <div class="class-count-label" id="class-count">Loading...</div>
      </div>

      <div id="search">
        <div class="search-wrapper">
          <i data-lucide="search" class="icon"></i>
          <input type="text" id="search-input" placeholder="Filter classes..." autofocus autocomplete="off" spellcheck="false" />
        </div>
      </div>

      <div class="sidebar-tabs">
        <button class="tab-btn active" data-tab="schemas" onclick="switch_tab('schemas')">Schemas</button>
        <button class="tab-btn" data-tab="globals" onclick="switch_tab('globals')">Globals</button>
        <button class="tab-btn" data-tab="protobufs" onclick="switch_tab('protobufs')">Protobufs</button>
      </div>

      <div id="classlist" role="listbox"></div>

      <div class="sidebar-footer">
        <div class="made-by">
          Made by <a href="https://elliie.dev" target="_blank" rel="noopener">elliie</a>
        </div>
        <div class="theme-dots">
          <div class="theme-dot active" data-theme="pink" title="Pink"></div>
          <div class="theme-dot" data-theme="purple" title="Purple"></div>
          <div class="theme-dot" data-theme="cyan" title="Cyan"></div>
          <div class="theme-dot" data-theme="emerald" title="Emerald"></div>
          <div class="theme-dot" data-theme="rose" title="Rose"></div>
        </div>
      </div>
    </div>

    <div id="main">
      <div id="topbar">
        <div class="tb-title" id="tb-class-name">Select an item</div>
        <div class="tb-sep"></div>
        <div class="tb-meta" id="tb-meta"></div>
      </div>
      <div id="content-scroll">
        <div id="content"></div>
      </div>
    </div>

    <script src="js/app.js"></script>
    <script>
      // Initialize icons
      lucide.createIcons();

      // Theme Switching Logic
      document.querySelectorAll('.theme-dot').forEach(dot => {
        dot.addEventListener('click', () => {
          const theme = dot.getAttribute('data-theme');
          document.documentElement.setAttribute('data-theme', theme);
          
          // Remove active class from all dots, add to clicked
          document.querySelectorAll('.theme-dot').forEach(d => d.classList.remove('active'));
          dot.classList.add('active');
        });
      });
    </script>
  </body>
</html>
